# Builds the site and deploys the "hammer-hound" Worker to Cloudflare on every push to main.
# Also copies the Worker's secrets from GitHub repository secrets, so GitHub is the one place they are kept.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: npm run build
      - name: API rule checks
        run: node test/api.test.mjs
      - name: Check Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing or empty repository secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing or empty repository secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Deploy first: secrets can only be attached to a Worker that already exists.
      # Wrangler 4 is called directly because the Cloudflare action defaults to an old
      # version that cannot read wrangler.jsonc.
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set Worker secrets
        run: |
          node scripts/write-secrets.mjs
          npx --yes wrangler@4 secret bulk secrets.json
          rm -f secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TEST_CODE: ${{ secrets.TEST_CODE }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
